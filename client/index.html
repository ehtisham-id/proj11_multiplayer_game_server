<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Server Test</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    
    .glass {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    #gameCanvas {
      background: #1a1a2e;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      height: auto;
    }
    
    .sidebar {
      background: rgba(0, 0, 0, 0.85);
      color: white;
      min-height: 100vh;
      padding: 30px;
      overflow-y: auto;
    }
    
    .item-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .item-card:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
    
    .item-card.active {
      background: rgba(102, 126, 234, 0.3);
      border-color: #667eea;
    }
  </style>
</head>
<body>
  
  <!-- Login Screen -->
  <div id="loginScreen" class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="glass p-5 text-center" style="max-width: 450px; width: 100%;">
      <h1 class="mb-4">
        <i class="bi bi-controller" style="color: #667eea;"></i>
        <br>Game Server
      </h1>
      
      <div class="mb-3 text-start">
        <label class="form-label fw-bold">Email</label>
        <input type="email" id="loginEmail" class="form-control form-control-lg" value="test@example.com">
      </div>
      
      <div class="mb-4 text-start">
        <label class="form-label fw-bold">Password</label>
        <input type="password" id="loginPassword" class="form-control form-control-lg" value="password123">
      </div>
      
      <div class="d-grid gap-3">
        <button onclick="login()" class="btn btn-primary btn-lg">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
        <button onclick="register()" class="btn btn-outline-secondary">
          <i class="bi bi-person-plus"></i> Register
        </button>
      </div>
      
      <div id="loginStatus" class="mt-3"></div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="d-none">
    <div class="row g-0">
      
      <!-- Sidebar -->
      <div class="col-lg-3 col-md-4 sidebar">
        
        <!-- User Info -->
        <div class="mb-4 pb-3 border-bottom">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <small class="text-muted">Logged in as</small>
              <div class="fw-bold" id="userEmail"></div>
            </div>
            <button onclick="logout()" class="btn btn-sm btn-danger">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </div>
        
        <!-- Status -->
        <div class="alert alert-info mb-4">
          <div class="d-flex align-items-center">
            <i class="bi bi-circle-fill text-success me-2"></i>
            <span id="statusText">Ready</span>
          </div>
        </div>
        
        <!-- Projects Section -->
        <div class="mb-4">
          <h5 class="mb-3">
            <i class="bi bi-folder"></i> Projects
          </h5>
          
          <div class="input-group mb-3">
            <input type="text" id="projectName" class="form-control" placeholder="Project Name" value="My Game">
            <button onclick="createProject()" class="btn btn-outline-light">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
          
          <div id="projectList"></div>
        </div>
        
        <!-- Matches Section -->
        <div class="mb-4">
          <h5 class="mb-3">
            <i class="bi bi-trophy"></i> Matches
          </h5>
          
          <button onclick="createMatch()" id="createMatchBtn" class="btn btn-warning w-100 mb-3" disabled>
            <i class="bi bi-plus-circle"></i> Create Match
          </button>
          
          <div id="matchList"></div>
        </div>
        
        <!-- Game Controls -->
        <div class="mb-4">
          <h5 class="mb-3">
            <i class="bi bi-joystick"></i> Game Controls
          </h5>
          
          <div class="d-grid gap-2">
            <button onclick="joinMatchmaking()" id="joinQueueBtn" class="btn btn-info" disabled>
              <i class="bi bi-search"></i> Join Matchmaking
            </button>
            <button onclick="spawnPlayer()" id="spawnBtn" class="btn btn-success" disabled>
              <i class="bi bi-play-circle"></i> Spawn Player
            </button>
            <button onclick="syncState()" class="btn btn-outline-light btn-sm">
              <i class="bi bi-arrow-clockwise"></i> Sync State
            </button>
          </div>
        </div>
        
      </div>
      
      <!-- Game Canvas -->
      <div class="col-lg-9 col-md-8 d-flex align-items-center justify-content-center p-4" 
           style="background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);">
        <div class="text-center">
          <div class="mb-3">
            <span class="badge bg-primary me-2">
              Project: <span id="projectDisplay">None</span>
            </span>
            <span class="badge bg-warning me-2">
              Match: <span id="matchDisplay">None</span>
            </span>
            <span class="badge bg-success">
              <i class="bi bi-people-fill"></i> <span id="playerCount">0</span>
            </span>
          </div>
          
          <canvas id="gameCanvas" width="800" height="600"></canvas>
          
          <div class="mt-3 text-light">
            <i class="bi bi-mouse"></i> Mouse + <i class="bi bi-keyboard"></i> WASD to move
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000';
    
    // State
    let token = null;
    let userId = null;
    let userEmail = null;
    let projectId = null;
    let matchId = null;
    let socket = null;
    let gameState = { actors: {} };
    let playerActorId = null;
    let canvas, ctx;
    let keys = {};
    
    // Cookie helpers
    function setCookie(name, value, days = 7) {
      const d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
    }
    
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? match[2] : null;
    }
    
    function deleteCookie(name) {
      document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/`;
    }
    
    // Status update
    function updateStatus(msg, type = 'info') {
      document.getElementById('statusText').textContent = msg;
      console.log(`[${type.toUpperCase()}] ${msg}`);
      
      const loginStatus = document.getElementById('loginStatus');
      if (loginStatus) {
        loginStatus.className = `alert alert-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'info'}`;
        loginStatus.textContent = msg;
      }
    }
    
    // API helper
    async function api(endpoint, options = {}) {
      const res = await fetch(`${API}${endpoint}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token && { Authorization: `Bearer ${token}` }),
          ...options.headers
        }
      });
      
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || res.statusText);
      }
      return res.json();
    }
    
    // AUTH: POST /auth/register
    async function register() {
      try {
        updateStatus('Registering...', 'info');
        const { accessToken, user } = await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        token = accessToken;
        userId = user.id;
        userEmail = user.email;
        setCookie('token', token);
        setCookie('email', userEmail);
        updateStatus('Registration successful!', 'success');
        setTimeout(startGame, 500);
      } catch (e) {
        updateStatus('Registration failed: ' + e.message, 'error');
      }
    }
    
    // AUTH: POST /auth/login
    async function login() {
      try {
        updateStatus('Logging in...', 'info');
        const { accessToken, user } = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        token = accessToken;
        userId = user.id;
        userEmail = user.email;
        setCookie('token', token);
        setCookie('email', userEmail);
        updateStatus('Login successful!', 'success');
        setTimeout(startGame, 500);
      } catch (e) {
        updateStatus('Login failed: ' + e.message, 'error');
      }
    }
    
    // AUTH: POST /auth/logout
    async function logout() {
      try {
        await api('/auth/logout', { method: 'POST' });
      } catch (e) {
        console.error('Logout error:', e);
      }
      
      deleteCookie('token');
      deleteCookie('email');
      token = null;
      userId = null;
      projectId = null;
      matchId = null;
      socket?.disconnect();
      document.getElementById('loginScreen').classList.remove('d-none');
      document.getElementById('gameScreen').classList.add('d-none');
      updateStatus('Logged out', 'info');
    }
    
    // PROJECTS: POST /projects
    async function createProject() {
      try {
        updateStatus('Creating project...', 'info');
        const project = await api('/projects', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('projectName').value || 'Game ' + Date.now(),
            maxPlayersPerMatch: 4
          })
        });
        projectId = project.id;
        await loadProjects();
        document.getElementById('createMatchBtn').disabled = false;
        document.getElementById('joinQueueBtn').disabled = false;
        updateStatus('Project created: ' + project.name, 'success');
        connectWebSocket();
      } catch (e) {
        updateStatus('Failed to create project: ' + e.message, 'error');
      }
    }
    
    // PROJECTS: GET /projects
    async function loadProjects() {
      try {
        const projects = await api('/projects');
        const list = document.getElementById('projectList');
        list.innerHTML = projects.map(p => `
          <div class="item-card ${p.id === projectId ? 'active' : ''}" onclick="selectProject('${p.id}')">
            <div class="fw-bold">${p.name}</div>
            <small class="text-muted">Max ${p.maxPlayersPerMatch} players</small>
          </div>
        `).join('');
      } catch (e) {
        updateStatus('Failed to load projects', 'error');
      }
    }
    
    function selectProject(id) {
      projectId = id;
      loadProjects();
      document.getElementById('projectDisplay').textContent = id.slice(0, 8);
      document.getElementById('createMatchBtn').disabled = false;
      document.getElementById('joinQueueBtn').disabled = false;
      updateStatus('Selected project', 'success');
      loadMatches();
      connectWebSocket();
    }
    
    // MATCHES: POST /projects/:projectId/matches
    async function createMatch() {
      if (!projectId) {
        updateStatus('Select a project first', 'error');
        return;
      }
      
      try {
        updateStatus('Creating match...', 'info');
        const match = await api(`/projects/${projectId}/matches`, { method: 'POST' });
        matchId = match.id;
        document.getElementById('matchDisplay').textContent = matchId.slice(0, 8);
        document.getElementById('spawnBtn').disabled = false;
        await loadMatches();
        updateStatus('Match created!', 'success');
      } catch (e) {
        updateStatus('Failed to create match: ' + e.message, 'error');
      }
    }
    
    // MATCHES: GET /projects/:projectId/matches
    async function loadMatches() {
      if (!projectId) return;
      
      try {
        const matches = await api(`/projects/${projectId}/matches`);
        const list = document.getElementById('matchList');
        list.innerHTML = matches.map(m => `
          <div class="item-card ${m.id === matchId ? 'active' : ''}" onclick="selectMatch('${m.id}')">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <div class="fw-bold">${m.id.slice(0, 8)}</div>
                <small class="text-muted">${m.status}</small>
              </div>
              <span class="badge bg-light text-dark">${m.players?.length || 0}</span>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to load matches:', e);
      }
    }
    
    function selectMatch(id) {
      matchId = id;
      document.getElementById('matchDisplay').textContent = matchId.slice(0, 8);
      document.getElementById('spawnBtn').disabled = false;
      loadMatches();
      updateStatus('Selected match: ' + matchId.slice(0, 8), 'success');
    }
    
    // WebSocket connection
    function connectWebSocket() {
      if (!projectId || !token || socket) return;
      
      socket = io(`${API}/game`, {
        auth: { projectId, accessToken: token }
      });
      
      socket.on('connect', () => {
        updateStatus('WebSocket connected', 'success');
      });
      
      socket.on('connected', (data) => {
        userId = data.userId;
        updateStatus('Authenticated with game server', 'success');
      });
      
      socket.on('match.found', (data) => {
        matchId = data.matchId;
        document.getElementById('matchDisplay').textContent = matchId.slice(0, 8);
        document.getElementById('spawnBtn').disabled = false;
        updateStatus('Match found!', 'success');
      });
      
      socket.on('actor.spawned', (actor) => {
        gameState.actors[actor.id] = actor.state;
        updatePlayerCount();
      });
      
      socket.on('actor.updated', (actor) => {
        if (gameState.actors[actor.id]) {
          gameState.actors[actor.id] = { ...gameState.actors[actor.id], ...actor.state };
        }
      });
      
      socket.on('state.synced', (state) => {
        gameState = state;
        updatePlayerCount();
      });
      
      socket.on('error', (err) => {
        updateStatus('WebSocket error: ' + err.message, 'error');
      });
    }
    
    // Game: matchmaking.join
    function joinMatchmaking() {
      if (!projectId || !socket) {
        updateStatus('Select a project first', 'error');
        return;
      }
      updateStatus('Joining matchmaking...', 'info');
      socket.emit('matchmaking.join', { projectId });
    }
    
    // Game: actor.spawn
    function spawnPlayer() {
      if (!matchId || !socket) {
        updateStatus('Join or create a match first', 'error');
        return;
      }
      
      playerActorId = `player_${userId}_${Date.now()}`;
      const x = 100 + Math.random() * 600;
      const y = 100 + Math.random() * 400;
      
      socket.emit('actor.spawn', {
        id: playerActorId,
        state: {
          x, y,
          data: {
            color: `hsl(${Math.random() * 360}, 70%, 60%)`,
            size: 20,
            name: userEmail ? userEmail.split('@')[0] : 'Player'
          }
        }
      });
      
      document.getElementById('spawnBtn').disabled = true;
      updateStatus('Player spawned! Use mouse/WASD to move', 'success');
      socket.emit('state.sync');
    }
    
    // Game: state.sync
    function syncState() {
      if (socket) {
        socket.emit('state.sync');
        updateStatus('State synced', 'success');
      }
    }
    
    function updatePlayerCount() {
      document.getElementById('playerCount').textContent = Object.keys(gameState.actors).length;
    }
    
    // Input handling
    function initInput() {
      document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
      document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
      
      canvas.addEventListener('mousemove', (e) => {
        if (playerActorId && gameState.actors[playerActorId]) {
          const rect = canvas.getBoundingClientRect();
          const targetX = ((e.clientX - rect.left) / rect.width) * 800;
          const targetY = ((e.clientY - rect.top) / rect.height) * 600;
          
          socket?.emit('actor.update', {
            id: playerActorId,
            state: { x: targetX, y: targetY }
          });
        }
      });
    }
    
    // Game loop
    function initGameLoop() {
      function loop() {
        updateMovement();
        render();
        requestAnimationFrame(loop);
      }
      loop();
    }
    
    function updateMovement() {
      if (playerActorId && gameState.actors[playerActorId]) {
        const actor = gameState.actors[playerActorId];
        const speed = 5;
        
        if (keys['w'] || keys['arrowup']) actor.state.y = Math.max(20, actor.state.y - speed);
        if (keys['s'] || keys['arrowdown']) actor.state.y = Math.min(580, actor.state.y + speed);
        if (keys['a'] || keys['arrowleft']) actor.state.x = Math.max(20, actor.state.x - speed);
        if (keys['d'] || keys['arrowright']) actor.state.x = Math.min(780, actor.state.x + speed);
        
        if (Math.random() < 0.15) {
          socket?.emit('actor.update', { id: playerActorId, state: actor.state });
        }
      }
    }
    
    function render() {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, 800, 600);
      
      // Grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 800; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 600);
        ctx.stroke();
      }
      for (let y = 0; y < 600; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(800, y);
        ctx.stroke();
      }
      
      // Players
      Object.entries(gameState.actors).forEach(([id, actor]) => {
        const { x, y, data } = actor.state;
        const size = data?.size || 20;
        const color = data?.color || '#4ecdc4';
        const isMe = id === playerActorId;
        
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.arc(x + 3, y + 3, size, 0, Math.PI * 2);
        ctx.fill();
        
        // Player
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
        
        // Border
        ctx.strokeStyle = isMe ? 'rgba(255, 255, 255, 0.9)' : 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = isMe ? 3 : 2;
        ctx.stroke();
        
        // Label
        ctx.fillStyle = 'white';
        ctx.font = isMe ? 'bold 13px Arial' : 'bold 11px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(data?.name || id.slice(0, 6), x, y - size - 12);
      });
    }
    
    // Initialize game
    function startGame() {
      document.getElementById('loginScreen').classList.add('d-none');
      document.getElementById('gameScreen').classList.remove('d-none');
      document.getElementById('userEmail').textContent = userEmail;
      
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');
      
      loadProjects();
      initInput();
      initGameLoop();
    }
    
    // Auto-login from cookie
    window.addEventListener('DOMContentLoaded', () => {
      const savedToken = getCookie('token');
      const savedEmail = getCookie('email');
      
      if (savedToken && savedEmail) {
        token = savedToken;
        userEmail = savedEmail;
        updateStatus('Restoring session...', 'info');
        startGame();
      }
    });
  </script>
  
</body>
</html>
