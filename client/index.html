<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snake Admin • Dev Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #071125;
      color: #e6eef8;
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(6px);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Courier New', monospace;
    }

    .muted {
      color: #9fb0c8;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="container py-5">
    <div class="row mb-4">
      <div class="col-md-8">
        <h1 class="h3 mb-1">Snake • Dev Console</h1>
        <p class="muted mb-0">Create projects & matches, get tokens, and open player clients.</p>
      </div>
      <div class="col-md-4 text-md-end align-self-center">
        <small class="muted">Backend</small>
        <input id="serverUrl" class="form-control form-control-sm mt-1" value="http://localhost:3000">
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <div class="p-3 glass rounded">
          <h5>Register</h5>
          <div class="mb-2"><input id="regEmail" class="form-control form-control-sm" placeholder="email@example.com">
          </div>
          <div class="mb-2"><input id="regPassword" type="password" class="form-control form-control-sm"
              placeholder="password (min 8)"></div>
          <div class="d-flex gap-2">
            <button id="btnRegister" class="btn btn-sm btn-outline-light">Register</button>
            <div id="regMsg" class="mono text-success align-self-center ms-2"></div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="p-3 glass rounded">
          <h5>Login</h5>
          <div class="mb-2"><input id="loginEmail" class="form-control form-control-sm" placeholder="email@example.com">
          </div>
          <div class="mb-2"><input id="loginPassword" type="password" class="form-control form-control-sm"
              placeholder="password"></div>
          <div class="d-flex gap-2">
            <button id="btnLogin" class="btn btn-sm btn-primary">Login</button>
            <button id="btnLogout" class="btn btn-sm btn-secondary hidden">Logout</button>
            <div id="loginMsg" class="mono ms-2 muted"></div>
          </div>
          <div class="mt-3">
            <small class="muted">Token</small>
            <div id="tokenBox" class="mono bg-black text-break p-2 rounded mt-1 hidden"></div>
            <button id="btnCopy" class="btn btn-sm btn-outline-light mt-2 hidden">Copy token</button>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="p-3 glass rounded">
          <h5>Create Project</h5>
          <div class="mb-2"><input id="projectName" class="form-control form-control-sm" placeholder="My Snake Project">
          </div>
          <div class="d-flex gap-2">
            <button id="btnCreateProject" class="btn btn-sm btn-success">Create Project</button>
            <div id="projectInfo" class="mono align-self-center ms-2 muted"></div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="p-3 glass rounded">
          <h5>Create Match</h5>
          <div class="mb-2"><input id="projectIdForMatch" class="form-control form-control-sm"
              placeholder="project-id (or select above)"></div>
          <div class="d-flex gap-2">
            <button id="btnCreateMatch" class="btn btn-sm btn-warning">Create Match</button>
            <div id="matchInfo" class="mono align-self-center ms-2 muted"></div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="p-3 glass rounded d-flex flex-wrap gap-2 align-items-center">
          <div><strong>Quick Actions</strong></div>
          <button id="openPlayerBtn" class="btn btn-sm btn-outline-light" title="Open a player window">Open
            Player</button>
          <button id="openTwoPlayersBtn" class="btn btn-sm btn-outline-light">Open 2 Players</button>
          <div id="statusLine" class="muted ms-auto mono"></div>
        </div>
      </div>
    </div>

    <!-- Dashboard (visible after login) -->
    <div id="dashboard" class="hidden container py-3">
      <div class="row">
        <div class="col-md-4">
          <div class="glass p-3 rounded">
            <h5>Projects</h5>
            <ul id="projectsList" class="list-group"></ul>
            <div class="mt-2">
              <small class="muted">Select a project to view matches</small>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="glass p-3 rounded">
            <h5>Matches <span id="selectedProjectName" class="muted"></span></h5>
            <ul id="matchesList" class="list-group"></ul>
            <div id="matchDetails" class="mt-3 mono muted"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      const qs = v => document.querySelector(v);
      const serverUrlInput = qs('#serverUrl');
      let token = localStorage.getItem('snake_access') || null;
      function api(path, opts = {}) {
        const url = (serverUrlInput.value || 'http://localhost:3000') + path;
        const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
        // Always read latest token from localStorage to avoid stale closure values
        const currentToken = localStorage.getItem('snake_access') || null;
        if (currentToken) headers['Authorization'] = 'Bearer ' + currentToken;

        return fetch(url, Object.assign({ headers }, opts)).then(async r => {
          if (r.status === 401) {
            // surface auth error to UI
            try { qs('#loginMsg').textContent = 'Unauthorized — please login'; } catch (e) { }
          }
          const text = await r.text();
          try { return JSON.parse(text); } catch { return text; }
        });
      }

      // Register
      qs('#btnRegister').addEventListener('click', async () => {
        const email = qs('#regEmail').value.trim();
        const password = qs('#regPassword').value;
        if (!email || !password) return qs('#regMsg').textContent = 'missing';
        try {
          const res = await api('/auth/register', { method: 'POST', body: JSON.stringify({ email, password }) });
          qs('#regMsg').textContent = 'Registered. Log in.';
        } catch (e) { qs('#regMsg').textContent = 'Failed'; }
      });

      // Login
      qs('#btnLogin').addEventListener('click', async () => {
        const email = qs('#loginEmail').value.trim();
        const password = qs('#loginPassword').value;
        if (!email || !password) return qs('#loginMsg').textContent = 'missing';
        try {
          const res = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
          // expect { accessToken, refreshToken, user }
          token = res && res.accessToken ? res.accessToken : null;
          if (token) {
            localStorage.setItem('snake_access', token);
            // verify token works before switching UI
            const ok = await verifyToken(token);
            if (!ok) {
              qs('#loginMsg').textContent = 'Login succeeded but token rejected by server';
              localStorage.removeItem('snake_access'); token = null;
              return;
            }

            qs('#tokenBox').textContent = token;
            qs('#tokenBox').classList.remove('hidden');
            qs('#btnCopy').classList.remove('hidden');
            qs('#btnLogout').classList.remove('hidden');
            qs('#btnLogin').classList.add('hidden');
            qs('#loginMsg').textContent = 'Logged in';
            // show dashboard and load projects
            try { await loadProjects(); qs('#dashboard').classList.remove('hidden'); qs('.row.g-3').classList.add('hidden'); } catch (e) { console.error(e); }
          } else qs('#loginMsg').textContent = 'No token';
        } catch (err) { qs('#loginMsg').textContent = 'Login failed'; }
      });

      qs('#btnLogout').addEventListener('click', () => {
        token = null; localStorage.removeItem('snake_access');
        qs('#tokenBox').classList.add('hidden'); qs('#btnCopy').classList.add('hidden');
        qs('#btnLogout').classList.add('hidden'); qs('#btnLogin').classList.remove('hidden');
        qs('#loginMsg').textContent = '';
        // hide dashboard and show auth area
        qs('#dashboard').classList.add('hidden');
        const authRow = document.querySelector('.row.g-3'); if (authRow) authRow.classList.remove('hidden');
      });

      qs('#btnCopy').addEventListener('click', () => navigator.clipboard.writeText(token));

      // Create project
      qs('#btnCreateProject').addEventListener('click', async () => {
        const name = qs('#projectName').value.trim();
        if (!name) return qs('#projectInfo').textContent = 'enter name';
        try {
          const res = await api('/projects', { method: 'POST', body: JSON.stringify({ name }) });
          const id = res && res.id ? res.id : (res && res.project && res.project.id ? res.project.id : null);
          qs('#projectInfo').textContent = id ? id : 'created';
          if (id) qs('#projectIdForMatch').value = id;
          // refresh project list and select created project
          try {
            await loadProjects();
            try {
              const proj = await api(`/projects/${id}`, { method: 'GET' });
              if (proj) selectProject(proj);
            } catch (e) { }
          } catch (e) { }
        } catch (e) { qs('#projectInfo').textContent = 'error'; }
      });

      // Create match
      qs('#btnCreateMatch').addEventListener('click', async () => {
        const projectId = qs('#projectIdForMatch').value.trim();
        if (!projectId) return qs('#matchInfo').textContent = 'project id';
        try {
          const res = await api('/projects/' + projectId + '/matches', { method: 'POST' });
          const id = res && res.id ? res.id : null;
          qs('#matchInfo').textContent = id || 'ok';
          qs('#statusLine').textContent = id ? `Match ${id}` : '';
          // refresh matches for the project
          try { await loadMatches(projectId); } catch (e) { }
        } catch (e) { qs('#matchInfo').textContent = 'error'; }
      });

      qs('#openPlayerBtn').addEventListener('click', () => {
        const matchId = qs('#matchInfo').textContent || '';
        const projectId = qs('#projectIdForMatch').value.trim() || '';
        const server = serverUrlInput.value || 'http://localhost:3000';
        const url = new URL('simple-game.html', window.location.href);
        if (matchId) url.searchParams.set('matchId', matchId);
        if (projectId) url.searchParams.set('projectId', projectId);
        if (token) url.searchParams.set('token', token);
        url.searchParams.set('server', server);
        window.open(url.toString(), '_blank');
      });

      qs('#openTwoPlayersBtn').addEventListener('click', () => {
        for (let i = 0; i < 2; i++) qs('#openPlayerBtn').click();
      });

      // Dashboard helpers
      async function verifyToken(tkn) {
        try {
          const base = serverUrlInput.value || 'http://localhost:3000';
          const res = await fetch(base + '/projects', { headers: { 'Authorization': 'Bearer ' + tkn } });
          return res.ok;
        } catch (e) {
          return false;
        }
      }

      async function loadProjects() {
        try {
          const projects = await api('/projects', { method: 'GET' }) || [];
          renderProjects(projects);
        } catch (e) { console.error('loadProjects', e); }
      }

      function renderProjects(projects) {
        const el = qs('#projectsList'); el.innerHTML = '';
        projects.forEach(p => {
          const li = document.createElement('li'); li.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-start';
          li.innerHTML = `<div><strong>${p.name || p.id}</strong><div class=muted style="font-size:12px">${p.id}</div></div>`;
          li.addEventListener('click', () => selectProject(p));
          el.appendChild(li);
        });
      }

      async function selectProject(p) {
        qs('#selectedProjectName').textContent = `• ${p.name || p.id}`;
        qs('#projectIdForMatch').value = p.id;
        await loadMatches(p.id);
        qs('#dashboard').classList.remove('hidden');
      }

      async function loadMatches(projectId) {
        try {
          const matches = await api(`/projects/${projectId}/matches`, { method: 'GET' }) || [];
          const el = qs('#matchesList'); el.innerHTML = '';
          matches.forEach(m => {
            const li = document.createElement('li'); li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `<div><strong>${m.id}</strong><div class=muted style="font-size:12px">status: ${m.status || 'unknown'}</div></div>`;
            const openBtn = document.createElement('button'); openBtn.className = 'btn btn-sm btn-outline-primary ms-2'; openBtn.textContent = 'Open Player';
            openBtn.addEventListener('click', () => openPlayerForMatch(m.id, projectId));
            const infoBtn = document.createElement('button'); infoBtn.className = 'btn btn-sm btn-secondary ms-2'; infoBtn.textContent = 'Details';
            infoBtn.addEventListener('click', () => viewMatch(projectId, m.id));
            const right = document.createElement('div'); right.appendChild(openBtn); right.appendChild(infoBtn);
            li.appendChild(right);
            el.appendChild(li);
          });
        } catch (e) { console.error('loadMatches', e); }
      }

      async function viewMatch(projectId, matchId) {
        try {
          const m = await api(`/projects/${projectId}/matches/${matchId}`, { method: 'GET' });
          qs('#matchDetails').textContent = JSON.stringify(m, null, 2);
        } catch (e) { qs('#matchDetails').textContent = 'Failed to load details'; }
      }

      function openPlayerForMatch(matchId, projectId) {
        const server = serverUrlInput.value || 'http://localhost:3000';
        const url = new URL('simple-game.html', window.location.href);
        url.searchParams.set('matchId', matchId);
        if (projectId) url.searchParams.set('projectId', projectId);
        if (token) url.searchParams.set('token', token);
        url.searchParams.set('server', server);
        window.open(url.toString(), '_blank');
      }

      // Populate UI if token exists (verify before showing dashboard)
      (async () => {
        if (!token) return;
        const ok = await verifyToken(token);
        if (ok) {
          qs('#tokenBox').textContent = token; qs('#tokenBox').classList.remove('hidden'); qs('#btnCopy').classList.remove('hidden'); qs('#btnLogout').classList.remove('hidden'); qs('#btnLogin').classList.add('hidden');
          try { await loadProjects(); } catch (e) { console.error(e); }
          qs('#dashboard').classList.remove('hidden'); qs('.row.g-3').classList.add('hidden');
        } else {
          // invalid token: clear
          localStorage.removeItem('snake_access'); token = null; qs('#loginMsg').textContent = 'Saved token invalid, please login';
        }
      })();
    })();
  </script>
</body>

</html>
