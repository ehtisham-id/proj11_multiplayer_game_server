<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Snake • Player</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #081226;
            color: #e6f7ff;
            font-family: Inter, system-ui, Segoe UI, Arial
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03)
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%
        }

        .status-dot.connected {
            background: #2ee6a0;
            box-shadow: 0 0 8px #2ee6a0
        }

        .status-dot.disconnected {
            background: #ff6b6b
        }

        #gameCanvas {
            display: block;
            margin: 28px auto;
            border-radius: 10px;
            background: #05060a;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6)
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6));
            z-index: 40
        }

        .panel {
            background: #071226;
            padding: 22px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            width: 360px;
            text-align: center
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            color: inherit
        }

        button {
            margin-top: 12px;
            padding: 10px 18px;
            border-radius: 8px;
            border: 0;
            background: #2ee6a0;
            color: #012;
            cursor: pointer
        }

        .controls {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 22px;
            display: grid;
            grid-template-columns: repeat(3, 64px);
            gap: 10px
        }

        .btnc {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            color: #2ee6a0;
            font-weight: 700;
            border: 0
        }
    </style>
</head>

<body>
    <div class="top">
        <div><strong>Snake</strong> <span style="opacity:.6;margin-left:8px" id="matchLabel"></span></div>
        <div style="display:flex;align-items:center;gap:12px">
            <div id="statusDot" class="status-dot disconnected"></div>
            <div id="statusText" style="opacity:.7">Disconnected</div>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="overlay">
        <div class="panel">
            <h2>Join Match</h2>
            <input id="matchId" placeholder="match id">
            <input id="projectId" placeholder="project id (optional)">
            <input id="serverUrl" placeholder="server (http://localhost:3000)" value="http://localhost:3000">
            <input id="token" placeholder="access token (optional)">
            <button id="btnJoin">Join</button>
            <div id="msg" style="margin-top:10px;opacity:.8"></div>
        </div>
    </div>

    <div class="controls" id="controls" style="display:none">
        <div></div><button class="btnc" data-dir="up">↑</button>
        <div></div>
        <button class="btnc" data-dir="left">←</button>
        <div></div><button class="btnc" data-dir="right">→</button>
        <div></div><button class="btnc" data-dir="down">↓</button>
        <div></div>
    </div>

    <script>
        (function () {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let socket = null; let actorId = null; let matchId = null; let projectId = null; let accessToken = null;
            const actors = {};
            const GRID = 20;

            function resize() { const w = Math.min(window.innerWidth - 80, 1000); const h = Math.min(window.innerHeight - 180, 700); canvas.width = w; canvas.height = h; }
            window.addEventListener('resize', resize); resize();

            function setStatus(text, connected) { document.getElementById('statusText').textContent = text; const dot = document.getElementById('statusDot'); dot.className = 'status-dot ' + (connected ? 'connected' : 'disconnected'); }

            function uuid() { return 'xxxxxxxx'.replace(/[x]/g, () => ((Math.random() * 16) | 0).toString(16)); }

            function render() {
                ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                // grid
                ctx.strokeStyle = 'rgba(255,255,255,0.02)'; ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += GRID) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
                for (let y = 0; y < canvas.height; y += GRID) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
                // draw snakes
                Object.values(actors).forEach(a => {
                    if (!a.segs) return; const head = a.segs[0]; const color = a.state?.data?.color || '#2ee6a0';
                    ctx.shadowColor = color; ctx.shadowBlur = 14;
                    a.segs.forEach((s, idx) => { ctx.globalAlpha = idx === 0 ? 1 : 0.8 - idx * 0.02; ctx.fillStyle = color; ctx.fillRect(s.x, s.y, GRID - 1, GRID - 1); });
                    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
                });
            }

            function startPing() { setInterval(() => { if (socket && socket.connected) socket.emit('state.sync'); }, 1000); }

            // local movement loop: updates local actor position and notifies server
            let moveInterval = null;
            function startMovementLoop() {
                if (moveInterval) return;
                moveInterval = setInterval(() => {
                    if (!actorId || !socket || !socket.connected) return;
                    const a = actors[actorId] || { state: { x: 0, y: 0, data: { direction: 'right', length: 4, color: '#2ee6a0' } } };
                    const dir = a.state.data?.direction || 'right';
                    const step = GRID;
                    let nx = a.state.x;
                    let ny = a.state.y;
                    if (dir === 'right') nx += step;
                    if (dir === 'left') nx -= step;
                    if (dir === 'down') ny += step;
                    if (dir === 'up') ny -= step;
                    // wrap around
                    if (nx < 0) nx = canvas.width - GRID;
                    if (ny < 0) ny = canvas.height - GRID;
                    if (nx >= canvas.width) nx = 0;
                    if (ny >= canvas.height) ny = 0;
                    // update local and emit
                    const newState = { x: nx, y: ny, data: { ...(a.state.data || {}), direction: dir, length: a.state.data?.length || 4, color: a.state.data?.color || '#2ee6a0' } };
                    actors[actorId] = { state: newState, segs: buildSegs(newState) };
                    try { socket.emit('actor.update', { id: actorId, state: newState }); } catch (e) { /* ignore */ }
                }, 120);
            }

            function connect() {
                const base = (document.getElementById('serverUrl').value || 'http://localhost:3000').replace(/\/$/, '');
                socket = io(base + '/game', { auth: { accessToken, projectId }, query: { matchId } });
                socket.on('connect', () => {
                    setStatus('Connected', true);
                    document.getElementById('overlay').style.display = 'none';
                    document.getElementById('controls').style.display = 'grid';
                    document.getElementById('matchLabel').textContent = matchId;
                    actorId = uuid(); // spawn
                    const initial = { x: Math.floor(Math.random() * (canvas.width - GRID)), y: Math.floor(Math.random() * (canvas.height - GRID)), data: { direction: 'right', length: 4, color: '#2ee6a0' } };
                    actors[actorId] = { state: initial, segs: buildSegs(initial) };
                    // Ask server to join this specific match (gateway will add socket to room)
                    socket.emit('match.found', { matchId });
                    socket.emit('actor.spawn', { id: actorId, state: initial });
                    startPing();
                    startMovementLoop();
                });

                socket.on('disconnect', () => { setStatus('Disconnected', false); document.getElementById('msg').textContent = 'Disconnected'; });
                socket.on('connected', d => { console.log('server connected', d); });

                socket.on('match.found', d => { document.getElementById('msg').textContent = 'Match found ' + d.matchId; });
                socket.on('actor.spawned', d => { actors[d.id] = { state: d.state, segs: buildSegs(d.state) }; render(); });
                socket.on('actor.updated', d => { actors[d.id] = { state: d.state, segs: buildSegs(d.state) }; render(); });
                socket.on('actor.removed', d => { delete actors[d.id]; render(); });
                socket.on('state.synced', s => { Object.keys(s.actors || {}).forEach(k => { const ent = s.actors[k]; actors[k] = { state: ent.state, segs: buildSegs(ent.state) }; }); render(); });
                socket.on('match.ended', d => { document.getElementById('msg').textContent = 'Match ended'; });
            }

            function buildSegs(state) { const segs = []; const len = (state.data && state.data.length) || 4; const dir = state.data?.direction || 'right'; for (let i = 0; i < len; i++) { let sx = state.x - (i * GRID * (dir === 'right' ? 1 : dir === 'left' ? -1 : 0)); let sy = state.y - (i * GRID * (dir === 'down' ? 1 : dir === 'up' ? -1 : 0)); segs.push({ x: sx, y: sy }); } return segs; }

            // controls (also update local state immediately for responsiveness)
            document.querySelectorAll('.btnc').forEach(b => b.addEventListener('click', () => {
                const d = b.dataset.dir;
                if (!actorId) return;
                // update local state immediately
                if (!actors[actorId]) actors[actorId] = { state: { x: 0, y: 0, data: { direction: d, length: 4, color: '#2ee6a0' } }, segs: [] };
                actors[actorId].state.data = { ...(actors[actorId].state.data || {}), direction: d };
                actors[actorId].segs = buildSegs(actors[actorId].state);
                render();
                if (socket && socket.connected) socket.emit('actor.update', { id: actorId, state: { data: { direction: d } } });
            }));

            document.addEventListener('keydown', e => {
                const map = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
                const d = map[e.key];
                if (!d || !actorId) return;
                if (!actors[actorId]) actors[actorId] = { state: { x: 0, y: 0, data: { direction: d, length: 4, color: '#2ee6a0' } }, segs: [] };
                actors[actorId].state.data = { ...(actors[actorId].state.data || {}), direction: d };
                actors[actorId].segs = buildSegs(actors[actorId].state);
                render();
                if (socket && socket.connected) socket.emit('actor.update', { id: actorId, state: { data: { direction: d } } });
            });

            document.getElementById('btnJoin').addEventListener('click', () => {
                matchId = document.getElementById('matchId').value.trim(); projectId = document.getElementById('projectId').value.trim() || undefined; accessToken = document.getElementById('token').value.trim() || undefined;
                if (!matchId) { document.getElementById('msg').textContent = 'enter match id'; return; }
                connect();
            });

            // auto-fill from query params
            const params = new URLSearchParams(location.search);
            if (params.get('matchId')) document.getElementById('matchId').value = params.get('matchId');
            if (params.get('projectId')) document.getElementById('projectId').value = params.get('projectId');
            if (params.get('server')) document.getElementById('serverUrl').value = params.get('server');
            if (params.get('token')) document.getElementById('token').value = params.get('token');

            // render loop
            (function loop() { render(); requestAnimationFrame(loop); })();
        })();
    </script>
</body>

</html>
