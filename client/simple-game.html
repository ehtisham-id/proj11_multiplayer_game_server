<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Snake Game</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .match-code {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #27ae60;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            word-break: break-all;
        }

        #gameCanvas {
            background: #0a0a0a;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 3px solid #2ecc71;
        }

        .sidebar {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            min-height: 100vh;
            padding: 30px;
            overflow-y: auto;
        }

        .player-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 3px solid transparent;
        }

        .player-item.me {
            background: rgba(46, 204, 113, 0.2);
            border-left-color: #2ecc71;
        }

        .score-badge {
            font-size: 2rem;
            font-weight: bold;
            color: #2ecc71;
        }
    </style>
</head>

<body>

    <!-- Join Screen -->
    <div id="joinScreen" class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="glass p-5 text-center" style="max-width: 500px; width: 100%;">
            <h1 class="mb-4">
                🐍<br>Multiplayer Snake
            </h1>

            <div class="mb-4 text-start">
                <label class="form-label fw-bold">Match ID</label>
                <input type="text" id="matchIdInput" class="form-control form-control-lg"
                    placeholder="Paste Match ID here">
                <small class="text-muted">Get Match ID from admin</small>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label fw-bold">Your Name</label>
                <input type="text" id="playerName" class="form-control form-control-lg" placeholder="Enter your name"
                    value="Player">
            </div>

            <div class="d-grid">
                <button onclick="joinGame()" class="btn btn-success btn-lg">
                    <i class="bi bi-play-circle"></i> Join & Play
                </button>
            </div>

            <div id="joinStatus" class="mt-3"></div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="d-none">
        <div class="row g-0">

            <!-- Sidebar -->
            <div class="col-lg-3 col-md-4 sidebar">

                <!-- Score -->
                <div class="mb-4 pb-3 border-bottom text-center">
                    <h5 class="mb-2 text-success">Your Score</h5>
                    <div class="score-badge" id="playerScore">0</div>
                    <div class="text-muted small mt-2" id="playerNameDisplay"></div>
                </div>

                <!-- Match Info -->
                <div class="mb-4 pb-3 border-bottom">
                    <h6 class="text-muted mb-2">Match ID</h6>
                    <div class="match-code" id="matchDisplay"></div>
                    <button onclick="leaveGame()" class="btn btn-danger btn-sm w-100 mt-2">
                        <i class="bi bi-box-arrow-left"></i> Leave Game
                    </button>
                </div>

                <!-- Status -->
                <div class="alert alert-success mb-4">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-circle-fill me-2"></i>
                        <span id="statusText">Playing</span>
                    </div>
                </div>

                <!-- Leaderboard -->
                <div class="mb-4">
                    <h5 class="mb-3">
                        <i class="bi bi-trophy-fill text-warning"></i> Leaderboard
                        <span class="badge bg-success ms-2" id="playerCount">1</span>
                    </h5>
                    <div id="playerList"></div>
                </div>

                <!-- Controls -->
                <div class="small text-muted">
                    <h6 class="text-light mb-2">
                        <i class="bi bi-keyboard"></i> Controls
                    </h6>
                    <div>⬆️ ⬇️ ⬅️ ➡️ Arrow Keys</div>
                    <div>W A S D Keys</div>
                    <div class="mt-3 p-2 bg-dark rounded">
                        <div class="text-warning">🍎 Eat food to grow</div>
                        <div class="text-danger">💀 Avoid walls & yourself</div>
                    </div>
                </div>

            </div>

            <!-- Game Canvas -->
            <div class="col-lg-9 col-md-8 d-flex flex-column align-items-center justify-content-center p-4"
                style="background: #000;">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
                <div class="mt-3 text-light">
                    <i class="bi bi-keyboard"></i> Use Arrow Keys or WASD to move your snake
                </div>
            </div>

        </div>
    </div>

    <script>
        const API = 'http://localhost:3000';
        const GRID_SIZE = 30;
        const CELL_SIZE = 20;
        const GAME_SPEED = 120;

        // State
        let matchId = null;
        let socket = null;
        let gameState = { actors: {} };
        let playerActorId = null;
        let canvas, ctx;
        let playerName = 'Player';

        // Snake game
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let gameLoopInterval = null;
        let playerScore = 0;
        let snake = [];
        let food = { x: 15, y: 15 };
        let isGameOver = false;

        // Cookie helpers
        function setCookie(name, value) {
            document.cookie = `${name}=${value};path=/;max-age=86400`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        // Status
        function updateStatus(msg, type = 'info') {
            const statusText = document.getElementById('statusText');
            if (statusText) statusText.textContent = msg;
            console.log(`[${type}] ${msg}`);

            const joinStatus = document.getElementById('joinStatus');
            if (joinStatus) {
                joinStatus.className = `alert alert-${type === 'error' ? 'danger' : 'success'}`;
                joinStatus.textContent = msg;
            }
        }

        // Join game - NO LOGIN REQUIRED
        function joinGame() {
            const matchInput = document.getElementById('matchIdInput').value.trim();
            const nameInput = document.getElementById('playerName').value.trim();

            if (!matchInput) {
                updateStatus('Please enter Match ID', 'error');
                return;
            }

            if (!nameInput) {
                updateStatus('Please enter your name', 'error');
                return;
            }

            matchId = matchInput;
            playerName = nameInput;

            setCookie('matchId', matchId);
            setCookie('playerName', playerName);

            updateStatus('Joining game...', 'info');
            startGame();
        }

        function leaveGame() {
            if (socket) {
                socket.disconnect();
            }
            clearInterval(gameLoopInterval);

            document.getElementById('joinScreen').classList.remove('d-none');
            document.getElementById('gameScreen').classList.add('d-none');
            document.getElementById('joinStatus').textContent = '';

            gameState = { actors: {} };
            snake = [];
            playerScore = 0;
            isGameOver = false;
        }

        // WebSocket connection - NO AUTH
        function connectWebSocket() {
            // Generate unique player ID
            playerActorId = 'snake_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

            socket = io(`${API}/game`);

            socket.on('connect', () => {
                updateStatus('Connected - Spawning snake...', 'success');
                spawnSnake();
            });

            socket.on('actor.spawned', (actor) => {
                gameState.actors[actor.id] = actor.state;
                updateLeaderboard();
            });

            socket.on('actor.updated', (actor) => {
                if (gameState.actors[actor.id]) {
                    gameState.actors[actor.id] = { ...gameState.actors[actor.id], ...actor.state };
                }
            });

            socket.on('state.synced', (state) => {
                gameState = state;
                updateLeaderboard();
            });

            socket.on('disconnect', () => {
                updateStatus('Disconnected', 'error');
            });
        }

        // Initialize snake
        function spawnSnake() {
            const startX = Math.floor(Math.random() * (GRID_SIZE - 10)) + 5;
            const startY = Math.floor(Math.random() * (GRID_SIZE - 10)) + 5;

            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];

            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            playerScore = 0;
            isGameOver = false;

            const color = `hsl(${Math.random() * 360}, 70%, 60%)`;

            // Spawn actor
            socket.emit('actor.spawn', {
                id: playerActorId,
                state: {
                    snake: snake,
                    color: color,
                    score: 0,
                    food: food,
                    data: {
                        name: playerName,
                        color: color
                    }
                }
            });

            updateStatus('Playing!', 'success');
            document.getElementById('playerScore').textContent = '0';

            // Request state sync
            setTimeout(() => socket.emit('state.sync'), 500);
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * GRID_SIZE),
                y: Math.floor(Math.random() * GRID_SIZE)
            };
        }

        function updateLeaderboard() {
            const count = Object.keys(gameState.actors).length;
            document.getElementById('playerCount').textContent = count;

            const players = Object.entries(gameState.actors).sort((a, b) => {
                return (b[1].state?.score || 0) - (a[1].state?.score || 0);
            });

            const list = document.getElementById('playerList');
            list.innerHTML = players.map(([id, actor], index) => {
                const isMe = id === playerActorId;
                const name = actor.state?.data?.name || 'Unknown';
                const color = actor.state?.data?.color || '#4ecdc4';
                const score = actor.state?.score || 0;
                const length = actor.state?.snake?.length || 3;

                return `
          <div class="player-item ${isMe ? 'me' : ''}">
            <div class="d-flex justify-content-between align-items-center">
              <div class="d-flex align-items-center flex-grow-1">
                <div class="me-2 fw-bold text-warning" style="min-width: 30px;">#${index + 1}</div>
                <div style="width: 12px; height: 12px; background: ${color}; border-radius: 2px; margin-right: 8px;"></div>
                <div class="flex-grow-1">
                  <div class="fw-bold">${name}</div>
                  <small class="text-muted">Length: ${length}</small>
                </div>
              </div>
              <span class="badge bg-success ms-2">${score}</span>
            </div>
          </div>
        `;
            }).join('');
        }

        // Input
        function initInput() {
            document.addEventListener('keydown', (e) => {
                if (isGameOver) return;

                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                        e.preventDefault();
                        break;
                }
            });
        }

        // Game loop
        function initGameLoop() {
            gameLoopInterval = setInterval(() => {
                if (!isGameOver) {
                    updateSnake();
                    render();
                }
            }, GAME_SPEED);
        }

        function updateSnake() {
            direction = nextDirection;

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // Self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                playerScore += 10;
                document.getElementById('playerScore').textContent = playerScore;
                generateFood();
            } else {
                snake.pop();
            }

            // Send update
            if (socket && playerActorId) {
                socket.emit('actor.update', {
                    id: playerActorId,
                    state: {
                        snake: snake,
                        score: playerScore,
                        food: food
                    }
                });
            }
        }

        function gameOver() {
            isGameOver = true;
            updateStatus('Game Over! Score: ' + playerScore, 'error');

            setTimeout(() => {
                if (confirm(`Game Over! Your score: ${playerScore}\\n\\nPlay again?`)) {
                    spawnSnake();
                    isGameOver = false;
                } else {
                    leaveGame();
                }
            }, 500);
        }

        function render() {
            // Clear
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 600, 600);

            // Grid
            ctx.strokeStyle = 'rgba(46, 204, 113, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, 600);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(600, i * CELL_SIZE);
                ctx.stroke();
            }

            // Food (shared across all players)
            if (gameState.actors[playerActorId]?.state?.food) {
                const sharedFood = gameState.actors[playerActorId].state.food;
                ctx.fillStyle = '#e74c3c';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#e74c3c';
                ctx.beginPath();
                ctx.arc(
                    sharedFood.x * CELL_SIZE + CELL_SIZE / 2,
                    sharedFood.y * CELL_SIZE + CELL_SIZE / 2,
                    CELL_SIZE / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Draw all snakes
            Object.entries(gameState.actors).forEach(([id, actor]) => {
                const snakeBody = actor.state?.snake || [];
                const color = actor.state?.data?.color || '#4ecdc4';
                const isMe = id === playerActorId;

                snakeBody.forEach((segment, index) => {
                    // Body
                    ctx.fillStyle = color;
                    ctx.fillRect(
                        segment.x * CELL_SIZE + 1,
                        segment.y * CELL_SIZE + 1,
                        CELL_SIZE - 2,
                        CELL_SIZE - 2
                    );

                    // Head decoration
                    if (index === 0) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                        ctx.fillRect(
                            segment.x * CELL_SIZE + 5,
                            segment.y * CELL_SIZE + 5,
                            4, 4
                        );
                        ctx.fillRect(
                            segment.x * CELL_SIZE + 11,
                            segment.y * CELL_SIZE + 5,
                            4, 4
                        );

                        // Highlight my snake
                        if (isMe) {
                            ctx.strokeStyle = '#2ecc71';
                            ctx.lineWidth = 3;
                            ctx.strokeRect(
                                segment.x * CELL_SIZE,
                                segment.y * CELL_SIZE,
                                CELL_SIZE,
                                CELL_SIZE
                            );
                        }
                    }
                });
            });
        }

        // Start game
        function startGame() {
            document.getElementById('joinScreen').classList.add('d-none');
            document.getElementById('gameScreen').classList.remove('d-none');
            document.getElementById('matchDisplay').textContent = matchId;
            document.getElementById('playerNameDisplay').textContent = playerName;

            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            connectWebSocket();
            initInput();
            initGameLoop();
        }

        // Auto-restore
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('matchIdInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') joinGame();
            });

            const savedMatch = getCookie('matchId');
            const savedName = getCookie('playerName');

            if (savedMatch && savedName) {
                document.getElementById('matchIdInput').value = savedMatch;
                document.getElementById('playerName').value = savedName;
            }
        });
    </script>

</body>

</html>
